<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        /* Tema uygulamadan gelir (data-theme): light | dark | private */
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #FFFFFF;
            --text: #121212;
            --muted: #757575;
            --accent: #3B82F6;
            --accent-soft: rgba(59, 130, 246, 0.12);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #121212;
            --text: #FFFFFF;
            --muted: #9E9E9E;
            --accent: #3B82F6;
            --accent-soft: rgba(59, 130, 246, 0.16);
        }

        :root[data-theme="private"] {
            color-scheme: dark;
            --bg: #1A121F;
            --text: #FFFFFF;
            --muted: #9E9E9E;
            --accent: #A78BFA;
            --accent-soft: rgba(167, 139, 250, 0.16);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 32px;
            max-width: 320px;
        }

        .icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 28px;
            display: block;
            stroke: var(--muted);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 8px;
        }

        p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--muted);
            margin: 0 0 28px;
        }

        .btn-retry {
            display: inline-block;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 9px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 999px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-retry:active {
            background-color: var(--accent-soft);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 8.8a15 15 0 0 1 20 0"/>
            <path d="M5 12.5a10 10 0 0 1 14 0"/>
            <path d="M8.5 16a5 5 0 0 1 7 0"/>
            <circle cx="12" cy="19.5" r="0.6"/>
            <path d="M3 3l18 18"/>
        </svg>
        <h1>{{TITLE}}</h1>
        <p>{{MESSAGE}}</p>
        <a href="{{RETRY_URL}}" class="btn-retry">{{RETRY_LABEL}}</a>
    </div>
</body>
</html>
