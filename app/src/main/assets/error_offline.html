<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bağlantı Yok</title>
    <style>
        body {
            background-color: #1A121F;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 24px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 24px;
            display: block;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 12px 0;
            font-weight: bold;
        }

        p {
            font-size: 16px;
            color: #757575;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        .btn-retry {
            background-color: #3B82F6;
            color: #FFFFFF;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            display: inline-block;
        }

        .btn-retry:active {
            background-color: #2563EB;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">📡</span>
        <h1>Bağlantı Yok</h1>
        <p>İnternet bağlantınızı kontrol edin ve tekrar deneyin</p>
        <a href="https://warden.retry" class="btn-retry">Tekrar Dene</a>
    </div>
</body>
</html>
